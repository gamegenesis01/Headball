<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>UFL Headball</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- HUD -->
  <div id="hud">
    <div id="hud-left">
      <span id="score-label">YOU</span>
      <span id="player-score">0</span>
    </div>
    <div id="hud-center">
      <span id="level-display">LEVEL 1</span>
      <span id="coins-display">🪙 0</span>
    </div>
    <div id="hud-right">
      <span id="ai-score">0</span>
      <span id="score-label-ai">CPU</span>
    </div>
  </div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Overlays -->
  <div id="overlay" class="hidden">
    <div id="overlay-box">
      <div id="overlay-title"></div>
      <div id="overlay-sub"></div>
      <button id="overlay-btn">PLAY</button>
    </div>
  </div>

  <!-- Mobile Controls – Joystick -->
  <div id="mobile-controls">
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>
      <div id="joystick-hint">&#8593; JUMP &nbsp;|&nbsp; &#8595; DIVE &nbsp;|&nbsp; &#8592;&#8594; MOVE</div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
